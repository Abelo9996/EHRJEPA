name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Create venv and install
        run: |
          uv venv --python ${{ matrix.python-version }}
          # CPU-only torch: the default PyPI wheel drags in ~2.5 GB of CUDA deps
          # that CI has no use for.
          uv pip install --index-url https://download.pytorch.org/whl/cpu torch
          uv pip install -e ".[dev]"
          # es-aces evaluates the task YAMLs; it is part of the "eval" extra,
          # installed separately because that extra also pulls xgboost, which
          # requires Python >= 3.12 and would break the 3.10 job.
          uv pip install es-aces

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format check)
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest
