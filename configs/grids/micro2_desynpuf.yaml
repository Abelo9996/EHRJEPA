# Pipeline test for the second pilot grid, not an experiment.
#
# Two runs of 100 steps each through the whole path grid 2 takes. The first cell
# turns on every flag any cell of `pilot2_desynpuf.yaml` uses, plus
# `predictor.mask_token_time` -- a superset of every single cell there -- because
# a cell that trains with all of them will train with any subset, and the paths
# worth smoke-testing at scale are the two that are not obviously cheap: the
# span-only target encoder's gather/scatter on MPS, and the chunked
# reconstruction softmax's peak memory. (`objective.recon_value` is the one flag
# not exercised here; grid 2 does not use it and it is covered by unit tests.)
# The second cell trains nothing at all: it re-scores the grid-1 `ar` checkpoint
# under the new `auto` pooling, which is what exercises `reuse_checkpoint`.
#
# 100 steps is 1,638,400 nominal token slots, 3.4% of a grid-2 cell's budget.
# **The AUROCs are what a barely-initialised encoder scores.** Nothing about them
# is interpretable, and the `micro2_ar_last` row is not comparable to the other
# one -- it is a fully trained 48M-token checkpoint sitting next to a 1.6M-token
# one, present only to prove the runner can place it there.

name: 2026-09-03-microgrid2
base: configs/pretrain_pilot.yaml
source: desynpuf-s1
budget_tokens: 1638400          # 100 x 64 x 256
seed: 0

# The same held-out cut, seed and resample count as every other number here.
bootstrap: 200
eval_subject_limit: 3000
eval_subject_seed: 0
probe_features: auto            # `last` for the causal cell, `mean` for the JEPA one
probe_layer: final
tasks: all

reuse_predictions: docs/experiments/2026-09-03-eval-desynpuf/predictions.parquet
reuse_models: [lr, gbm]
control_models: [random_init]
control_runs: [micro2_all_flags]

runs:
  - name: micro2_all_flags
    overrides:
      objective.kind: jepa
      model.target_mode: ema
      objective.lambda_sigreg: 0.05
      objective.lambda_recon: 0.1
      predictor.mask_token_time: false
      target.time_features: false
      target.span_only: true
      train.time_feature_dropout: 0.3

  - name: micro2_ar_last
    reuse_checkpoint: runs/2026-09-03-pilot-desynpuf/ar/final.pt
