# RTX 4060 scale-up grid, not yet run. Four cells at 500M nominal token slots
# each (~20x the 48M-token pilot budget; ar and hybrid only, about 8.5 h per cell on an RTX 4060 at ~33k tok/s), on
# configs/pretrain_scale.yaml's 6-layer/256-wide encoder rather than the
# pilot's 4x192 one. See docs/CUDA_SETUP.md for how to launch this.
#
# The four cells are the pilot grids' headline rows, carried forward rather
# than re-derived:
#
#   ar          next-code cross-entropy, causal. Grid 1's reference cell and,
#               at 48M tokens, the largest gain over its own random_init
#               control of any single-objective cell (+0.0445 mean AUROC).
#   hybrid      dense causal next-latent prediction at horizons [1, 4, 16]
#               plus the AR next-code loss through the same tied head
#               (lambda_recon 0.1). Grid 4's `nextlatent_h1416_recon`: the
#               single highest-gain, highest-absolute-AUROC cell across all
#               four pilot grids (+0.0923, mean AUROC 0.7287).
#   recon_only  masked-span objective with the latent smooth-L1 term dropped
#               (lambda_pred 0) and code reconstruction as the only signal
#               (lambda_recon 0.1). Grid 3's finding was that this scores
#               within 0.004 AUROC of the same config with the latent term
#               left on -- carried forward to see whether that holds at 10x
#               the tokens and a larger encoder.
#   jepa_ema    the original masked-span latent JEPA (EMA target, SIGReg 0.05,
#               60/40 future/block masking) -- grid 1's `jepa_ema`, included as
#               the objective this whole ablation line started from, even
#               though it did not beat its control at the pilot budget.
#
# See docs/experiments/PILOT_RESULTS.md for the grids 1-4 numbers these four
# cells are read against.

name: scale1b-final-desynpuf
base: configs/pretrain_scale.yaml
source: desynpuf-s1
budget_tokens: 1000000000
seed: 0

# Same eval subset and bootstrap budget as the pilot grids, so a number here
# lands in the same frame as docs/experiments/PILOT_RESULTS.md.
bootstrap: 200
eval_subject_limit: null
eval_subject_seed: 0
probe_features: auto
probe_layer: final
tasks: all

reuse_predictions: null
reuse_models: [lr, gbm]
control_models: [random_init]
# One untrained control per architecture: `ar` and `hybrid` are both causal
# (last@final pooling), `recon_only` and `jepa_ema` are both bidirectional
# (mean@final) -- same reasoning as grids 1-4's control_runs.
control_runs: [hybrid_final_s0]

runs:
  - name: hybrid_final_s0
    overrides:
      run.seed: 0
      objective.kind: nextlatent
      model.causal: true
      model.target_mode: ema
      objective.horizons: [1, 4, 16]
      objective.lambda_recon: 0.1
      objective.lambda_sigreg: 0.0

  - name: hybrid_final_s1
    overrides:
      run.seed: 1
      objective.kind: nextlatent
      model.causal: true
      model.target_mode: ema
      objective.horizons: [1, 4, 16]
      objective.lambda_recon: 0.1
      objective.lambda_sigreg: 0.0

  - name: hybrid_final_s2
    overrides:
      run.seed: 2
      objective.kind: nextlatent
      model.causal: true
      model.target_mode: ema
      objective.horizons: [1, 4, 16]
      objective.lambda_recon: 0.1
      objective.lambda_sigreg: 0.0

  - name: ar_s0_full
    reuse_checkpoint: runs/scale1b-desynpuf/ar/final.pt

  - name: hybrid_s0_full
    reuse_checkpoint: runs/scale1b-desynpuf/hybrid/final.pt

  - name: ar_s1_full
    reuse_checkpoint: runs/scale1b-seeds-desynpuf/ar_s1/final.pt

  - name: hybrid_s1_full
    reuse_checkpoint: runs/scale1b-seeds-desynpuf/hybrid_s1/final.pt

  - name: ar_s2_full
    reuse_checkpoint: runs/scale1b-seeds-desynpuf/ar_s2/final.pt

  - name: hybrid_s2_full
    reuse_checkpoint: runs/scale1b-seeds-desynpuf/hybrid_s2/final.pt

