# Pipeline test for the fourth pilot grid, not an experiment.
#
# One run per new objective, 50 steps each, through the whole path grid 4 takes:
# the causal encoder plus an EMA target stack under `objective.kind: nextlatent`
# and `window`, the horizon heads and the anchor sampler, the two auxiliary
# terms (next-code cross-entropy for the first, multi-label BCE for the second),
# the checkpoint's new `model.build_predictor`/`horizons`/`window_horizons`
# fields, and `ehrjepa.eval.probe.load_encoder` rebuilding each class from them
# with `auto` pooling resolving to `last@final` on a causal checkpoint.
#
# The recon variants are the ones run here because they exercise strictly more
# than the plain ones: every module a plain cell builds, plus the head.
#
# 50 steps is 819,200 nominal token slots, 1.7% of a grid-4 cell's budget.
# **The AUROCs are what a barely-initialised encoder scores.** Nothing about
# them is interpretable; this run exists to prove the runner, the models and the
# eval harness go end to end on this commit, and to measure each design's peak
# memory at the real batch shape, before grid 4 is queued for real.

name: 2026-09-04-microgrid4
base: configs/pretrain_pilot.yaml
source: desynpuf-s1
budget_tokens: 819200          # 50 x 64 x 256
seed: 0

# The same held-out cut, seed and resample count as every other number here.
bootstrap: 200
eval_subject_limit: 3000
eval_subject_seed: 0
probe_features: auto
probe_layer: final
tasks: all

reuse_predictions: docs/experiments/2026-09-03-eval-desynpuf/predictions.parquet
reuse_models: [lr, gbm]
control_models: [random_init]
control_runs: [micro4_nextlatent]

runs:
  - name: micro4_nextlatent
    overrides:
      objective.kind: nextlatent
      model.causal: true
      model.target_mode: ema
      objective.horizons: [1, 4, 16]
      objective.lambda_sigreg: 0.05
      objective.lambda_recon: 0.1

  - name: micro4_window
    overrides:
      objective.kind: window
      model.causal: true
      model.target_mode: ema
      objective.window_horizons: [30, 365]
      objective.window_anchors: 8
      objective.lambda_sigreg: 0.05
      objective.lambda_recon: 0.1
