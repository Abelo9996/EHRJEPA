# Phase 5a pilot: does the JEPA objective learn anything a next-code objective
# does not, at a matched token budget, and does either beat random init?
#
# Six runs, one budget, one seed. The first is the autoregressive control; the
# next five vary one JEPA knob each against `jepa_ema`, which is the reference
# cell -- EMA targets, SIGReg on, the shipped 60/40 future/block masking mix.
#
# Budget: 48M nominal token slots = 2,930 steps at 64 x 256. Measured on the M4,
# that is ~40 min for the `ar` cell (10.0k tok/s) and ~33 min for a JEPA cell
# (12.2k tok/s), inside the 45-minute-per-run ceiling this grid was sized to.
#
# Why not the 12M the phase brief starts from: 12M slots is 733 steps, which is
# *less* compute than the 900-step sanity runs that already tied with a
# random-init probe. A grid at that budget could only reproduce that tie, and
# half of what phase 5a asks is whether anything changes with longer training.
# 48M is 3.3x the sanity runs and, at the 47% fill this cache shows at max_len
# 256 (mean window 121 events of 256, measured over 2,000 draws), about 22.7M
# real events -- roughly 2.0 epochs of the 11.3M-event train split. Still nowhere
# near converged; enough to move.

name: 2026-09-03-pilot-desynpuf
base: configs/pretrain_pilot.yaml
source: desynpuf-s1
budget_tokens: 48000000
seed: 0

# Identical to the phase-4 evaluation, so the numbers land in the same frame:
# same 3,000-subject held-out cut, same seed, same 200 resamples.
bootstrap: 200
eval_subject_limit: 3000
eval_subject_seed: 0
probe_features: cls_mean
probe_layer: final
tasks: all

# `lr` and `gbm` are count-feature models: nothing about them depends on the
# encoder, so refitting them six times would burn an hour to reproduce numbers
# that already exist. `random_init` does depend on the architecture and is
# recomputed once against this grid's own 4x192 encoder.
reuse_predictions: docs/experiments/2026-09-03-eval-desynpuf/predictions.parquet
reuse_models: [lr, gbm]
control_models: [random_init]
# One untrained control per architecture, not one per grid: a causal encoder's
# CLS row is a constant even untrained, so the AR cell and the JEPA cells need
# different controls to be compared against the same probe.
control_runs: [ar, jepa_ema]

runs:
  - name: ar
    overrides:
      objective.kind: ar
      model.causal: true
      model.tie_embeddings: true

  - name: jepa_ema
    overrides:
      objective.kind: jepa
      model.target_mode: ema
      objective.lambda_sigreg: 0.05

  - name: jepa_ema_nosig
    overrides:
      objective.kind: jepa
      model.target_mode: ema
      objective.lambda_sigreg: 0.0

  - name: jepa_shared_sig
    overrides:
      objective.kind: jepa
      model.target_mode: shared
      objective.lambda_sigreg: 0.05

  - name: jepa_ema_future
    overrides:
      objective.kind: jepa
      model.target_mode: ema
      objective.lambda_sigreg: 0.05
      masking.p_future: 1.0

  - name: jepa_ema_block
    overrides:
      objective.kind: jepa
      model.target_mode: ema
      objective.lambda_sigreg: 0.05
      masking.p_future: 0.0
